<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach Badminton V3</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:#172033;color:white;padding:18px;position:sticky;top:0;z-index:2}header h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:#cbd5e1;font-size:13px}main{max-width:900px;margin:auto;padding:16px}.grid,.tech{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.panel,.hero{background:white;border:1px solid #dbe1ea;border-radius:16px;padding:16px}.card{cursor:pointer}.card h2{font-size:17px;margin:8px 0}.card p{margin:0;color:#5d687a;font-size:13px;line-height:1.45}.icon{font-size:28px}button{border:0;border-radius:11px;padding:10px 13px;background:#172033;color:white;font-weight:700;cursor:pointer}.back{background:#e8edf5;color:#172033;margin-bottom:12px}.levels{display:flex;gap:8px;overflow:auto;margin:12px 0}.level{background:white;color:#172033;border:1px solid #ccd5e2;white-space:nowrap}.level.active{background:#172033;color:white}.panel{margin-top:12px}.panel h3{font-size:15px;margin-bottom:6px}.panel p,.panel li{font-size:14px;line-height:1.55}.success{background:#eef4ff;border-left:4px solid #172033;padding:10px;border-radius:10px}.var{padding:10px;border-radius:10px;margin-top:9px}.easy{background:#eef8ef}.hard{background:#fff0f0}.tag{font-size:12px;font-weight:700;background:#eef2f7;border-radius:99px;padding:5px 9px;display:inline-block}.choice{display:grid;gap:9px}.choice button{background:white;color:#172033;border:1px solid #ccd5e2;text-align:left}@media(max-width:650px){.grid,.tech{grid-template-columns:1fr}}</style></head><body><header><h1>🏸 Coach Badminton</h1><p>EPS • Terminales • Choisis ton projet, entraîne-toi, progresse.</p></header><main id="app"></main>
<script>const D={"projects": [["service", "🎯", "Être efficace au service", "Précision, régularité et intention tactique."], ["attack", "💥", "Créer une attaque efficace", "Reconnaître un volant favorable et attaquer."], ["opportunity", "⚡", "Créer une occasion d’attaque", "Construire une situation favorable."], ["move", "🔀", "Déplacer mon adversaire", "Utiliser avant/arrière et droite/gauche."], ["net", "🥅", "Dominer le filet", "Prendre tôt et jouer court."], ["point", "🧠", "Construire et gagner le point", "Observer, décider et enchaîner."]], "exercises": {"service": [{"level": "Découvrir", "title": "Service court : viser une zone", "objective": "Faire tomber le volant entre le filet et la ligne de service court adverse.", "org": "Par 2 : serveur et receveur. 10 services chacun, dans la zone droite ou gauche.", "instructions": "1. Pieds stables. 2. Volant tenu par les plumes devant toi. 3. Raquette basse, sous la taille. 4. Lâche le volant sans le lancer. 5. Petit geste contrôlé. 6. Fais passer le volant juste au-dessus du filet. 7. Vise entre le filet et la ligne de service court.", "tips": ["Je garde mes appuis stables.", "Je ne lance pas le volant.", "Je fais un petit geste.", "Je vise précisément entre le filet et la ligne de service court."], "success": "7/10 dans la zone.", "easy": ["Agrandir la cible.", "Autoriser un deuxième essai."], "hard": ["Cible de 50 cm.", "Le receveur annonce sa zone."]}, {"level": "Stabiliser", "title": "Service court sous pression", "objective": "Garder la précision quand le receveur est prêt.", "org": "2 séries de 10 : d’abord sans retour, puis avec retour possible.", "instructions": "Même routine à chaque service. Regarde la cible, sers, puis replace immédiatement la raquette devant toi.", "tips": ["Je privilégie la précision.", "Je regarde la cible.", "Je me replace après le service."], "success": "14/20 dans la cible.", "easy": ["Sans retour sur les 20 services."], "hard": ["Receveur actif et mobile."]}, {"level": "Réinvestir", "title": "Service + intention tactique", "objective": "Choisir court ou long selon la position du receveur.", "org": "10 mises en jeu. Le receveur est avancé, reculé ou centré.", "instructions": "1. Observe. 2. Choisis court ou long. 3. Sers. 4. Explique ton choix.", "tips": ["Je regarde la position adverse.", "Je relie mon choix à l’espace disponible."], "success": "7/10 choix expliqués par une intention cohérente.", "easy": ["Position annoncée."], "hard": ["Position choisie librement."]}], "attack": [{"level": "Découvrir", "title": "Découvrir le smash", "objective": "Produire une frappe descendante sur un volant haut.", "org": "Par 2. Le lanceur est environ 2 m devant et envoie 10 volants hauts vers l’arrière. Le frappeur démarre environ 1 m derrière la zone prévue.", "instructions": "1. Recule plus loin que le volant. 2. Le volant doit être devant toi à l’impact, pas au-dessus de ta tête. 3. Arme le bras loin derrière. 4. Garde les appuis fixes et la jambe forte derrière. 5. Frappe haut et devant. 6. Geste fort, descendant, qui part loin derrière et finit face au filet. 7. Replace-toi.", "tips": ["Je recule plus loin que le volant.", "Le volant est devant moi à l’impact.", "J’arme le bras loin derrière.", "Je frappe avec un geste descendant.", "Mes appuis sont stables et ma jambe forte est derrière."], "success": "7/10 trajectoires descendantes atteignant la moitié avant.", "easy": ["Volants plus hauts et lents."], "hard": ["Varier légèrement la profondeur."]}, {"level": "Stabiliser", "title": "Smash placé", "objective": "Conserver une trajectoire descendante vers une cible.", "org": "12 smashs. Deux cibles de 2 m × 2 m dans la moitié avant adverse. Annonce la cible.", "instructions": "Place-toi derrière, prépare tôt, frappe haut et devant, dirige vers la cible, replace-toi.", "tips": ["Je me place avant l’impact.", "Je contrôle direction et puissance."], "success": "8/12 dans la cible avec trajectoire descendante.", "easy": ["Cibles 3 m × 3 m."], "hard": ["Cibles 1 m × 1 m."]}, {"level": "Réinvestir", "title": "Smash pour gagner l’échange", "objective": "Attaquer seulement un volant favorable.", "org": "10 échanges sur tout le terrain.", "instructions": "Construis jusqu’à un volant haut, devant toi et suffisamment éloigné de ta tête. Attaque vers un espace libre puis prépare le coup suivant.", "tips": ["Je n’attaque pas trop bas ou trop derrière.", "Je choisis une zone libre."], "success": "7/10 attaques déclenchées sur un volant favorable.", "easy": ["Partenaire envoie régulièrement un volant favorable."], "hard": ["Défenseur varie ses retours."]}], "opportunity": [{"level": "Découvrir", "title": "Dégagé offensif", "objective": "Repousser l’adversaire vers le fond avec une trajectoire longue et relativement tendue.", "org": "10 volants hauts vers l’arrière. Cible : dernier tiers, entre la ligne de fond et 1 m devant.", "instructions": "1. Déplace-toi derrière. 2. Prépare tôt. 3. Contact haut et légèrement devant. 4. Accélère vers l’avant et le haut. 5. Vise le dernier tiers.", "tips": ["Je prends le volant haut.", "Je vise précisément le dernier tiers."], "success": "7/10 dans le dernier tiers.", "easy": ["Cible = moitié arrière."], "hard": ["Bande de 1 m."]}, {"level": "Stabiliser", "title": "Amorti pour faire bouger", "objective": "Faire tomber le volant court pour attirer l’adversaire.", "org": "A au fond, B au milieu. B envoie haut à A. A amortit 10 fois. Cible : entre le filet et la moitié de la rivière.", "instructions": "1. Place-toi derrière. 2. Prépare comme pour un dégagé. 3. Contact haut et devant. 4. Ralentis au contact. 5. Passe juste au-dessus du filet. 6. Vise entre le filet et la moitié de la rivière.", "tips": ["Je garde une préparation proche du dégagé.", "Je ralentis au contact.", "Je vise précisément la zone avant."], "success": "7/10 dans la zone.", "easy": ["Agrandir à 2/3 avant."], "hard": ["Bande de 1 m derrière la ligne de service court."]}, {"level": "Réinvestir", "title": "Construire puis attaquer", "objective": "Créer une situation favorable avant d’attaquer.", "org": "8 échanges. A commence par dégagé offensif ou amorti; B renvoie haut si possible.", "instructions": "Déplace B, observe hauteur et profondeur du retour, puis attaque seulement si le volant est haut et devant.", "tips": ["Je n’attaque pas immédiatement.", "J’observe la réponse."], "success": "5 occasions d’attaque créées sur 8.", "easy": ["B renvoie systématiquement haut."], "hard": ["B varie ses réponses."]}], "move": [{"level": "Découvrir", "title": "Avant / arrière", "objective": "Faire déplacer l’adversaire entre zone avant et zone arrière.", "org": "B au centre. A alterne zone avant (filet → ligne de service court) et dernier tiers arrière. 10 cycles.", "instructions": "Pars d’une position stable. Déclenche au départ du volant. En avant : fente et contact devant. En arrière : recule vite. Après chaque frappe, reviens au centre.", "tips": ["Je pars raquette devant.", "Je déclenche vite.", "Je reviens au centre."], "success": "8/10 retours au centre.", "easy": ["Direction annoncée."], "hard": ["Direction non annoncée."]}, {"level": "Stabiliser", "title": "Largeur / profondeur", "objective": "Enchaîner deux zones éloignées.", "org": "4 cibles : avant droite/gauche et arrière droite/gauche. A joue deux zones éloignées, B se déplace et revient.", "instructions": "Après le premier coup, observe B et choisis une deuxième zone éloignée.", "tips": ["Je regarde où est B.", "Je cherche une vraie différence entre les zones."], "success": "8/12 séquences provoquent un déplacement net.", "easy": ["Limiter avant/arrière."], "hard": ["Deux zones diagonales."]}, {"level": "Réinvestir", "title": "Créer puis exploiter l’espace", "objective": "Jouer dans l’espace libéré.", "org": "10 points. A réalise au moins 2 frappes avant de chercher à conclure.", "instructions": "Observe B après chaque frappe. Déplace-le puis joue dans la zone opposée libre.", "tips": ["Je regarde B avant de choisir.", "Je crée puis j’exploite l’espace."], "success": "6/10 points exploitent clairement l’espace.", "easy": ["B garde sa position 2 s."], "hard": ["B se replace librement."]}], "net": [{"level": "Découvrir", "title": "Prendre le volant haut", "objective": "Prendre tôt un volant près du filet.", "org": "A démarre 1 m derrière la ligne de service court. B envoie 10 volants courts.", "instructions": "1. Raquette devant et haute. 2. Avance vite. 3. Pied de raquette devant en fente. 4. Contact devant et au-dessus de la hauteur du filet. 5. Repousse-toi pour revenir.", "tips": ["Je garde la raquette haute.", "Je prends tôt.", "Je contacte devant et au-dessus du filet."], "success": "7/10 prises devant et au-dessus du filet.", "easy": ["Envois proches et hauts."], "hard": ["Varier droite/gauche."]}, {"level": "Stabiliser", "title": "Contre-amorti", "objective": "Répondre court et précisément à un amorti.", "org": "A juste derrière sa ligne de service court. B joue 10 volants courts. Cible : entre le filet et la moitié de la rivière.", "instructions": "Avance, raquette haute, fente, contact devant et au-dessus du filet, geste très court, force dosée, vise précisément la zone cible.", "tips": ["Je ne fais pas de grand geste.", "Je dose la force.", "Je vise précisément entre le filet et la moitié de la rivière."], "success": "7/10 dans la zone.", "easy": ["Volants plus hauts."], "hard": ["Alterner droite/gauche."]}, {"level": "Réinvestir", "title": "Filet puis attaque", "objective": "Provoquer un retour haut puis attaquer.", "org": "8 séquences : réception courte, jeu au filet, B renvoie haut, A recule et attaque.", "instructions": "Observe la réponse après le jeu au filet. Recule assez pour prendre le volant devant toi et attaque.", "tips": ["Je regarde le retour.", "Je recule suffisamment."], "success": "6/8 séquences aboutissent à une attaque sur retour haut.", "easy": ["B renvoie toujours haut."], "hard": ["B choisit son retour."]}], "point": [{"level": "Découvrir", "title": "Observer avant d’agir", "objective": "Identifier la position de l’adversaire avant de choisir.", "org": "1 contre 1 sur une moitié de terrain en largeur. Avant chaque frappe, A annonce : droite, gauche, avant ou arrière.", "instructions": "Regarde B, nomme sa position, identifie l’espace libre puis choisis ta frappe.", "tips": ["Je regarde mon adversaire avant de frapper.", "Je prends une information simple."], "success": "7/8 identifications correctes.", "easy": ["B reste dans une zone."], "hard": ["B change rapidement."]}, {"level": "Stabiliser", "title": "Deux coups pour déplacer", "objective": "Enchaîner deux frappes vers des zones éloignées.", "org": "Tout le terrain. Première frappe vers une zone précise, deuxième vers une zone éloignée.", "instructions": "Observe où B arrive après le premier coup, puis choisis la deuxième zone.", "tips": ["Je prépare mon deuxième choix en observant B."], "success": "7/10 séquences avec déplacement net.", "easy": ["Zones imposées."], "hard": ["Deuxième zone choisie après observation."]}, {"level": "Réinvestir", "title": "Construire le point", "objective": "Enchaîner plusieurs coups avec une intention claire.", "org": "8 points sur tout le terrain. Après chaque point, explique ton intention.", "instructions": "Observe, déplace si nécessaire, cherche une occasion favorable puis explique ce que tu voulais provoquer.", "tips": ["Je donne une intention à mes premières frappes.", "Je m’adapte."], "success": "6/8 points avec intention cohérente.", "easy": ["Pause de 5 s avant remise."], "hard": ["Explication en 10 s maximum."]}]}, "techniques": [{"id": "off", "icon": "🚀", "title": "Dégagé offensif", "purpose": "Repousser l’adversaire vers le fond avec une trajectoire longue et relativement tendue.", "match": "Il fait reculer l’adversaire et prépare une suite.", "responses": "Retour moins offensif ou moins précis possible.", "how": ["Je me place derrière le volant.", "Je prépare tôt derrière la tête.", "Je contacte haut et légèrement devant.", "J’accélère vers l’avant et le haut.", "Je vise le dernier tiers.", "Je me replace."], "exercise": "10 dégagés vers le dernier tiers", "org": "10 volants hauts vers l’arrière; cible entre la ligne de fond et 1 m devant.", "success": "7/10 dans le dernier tiers."}, {"id": "def", "icon": "🛡️", "title": "Dégagé défensif", "purpose": "Envoyer très haut et très long pour gagner du temps.", "match": "Il permet de sortir d’une situation difficile.", "responses": "L’adversaire doit attendre davantage et peut être repoussé.", "how": ["Je me place derrière même en retard.", "Je prépare tôt.", "Je contacte haut et légèrement devant.", "Je donne surtout de la hauteur.", "Je vise près de la ligne de fond.", "Je me replace."], "exercise": "Donner du temps avec un dégagé haut", "org": "10 volants hauts légèrement difficiles; cible = dernier mètre avant la ligne de fond.", "success": "7/10 dans le dernier mètre."}, {"id": "drive", "icon": "➡️", "title": "Drive", "purpose": "Jouer vite et presque horizontalement pour réduire le temps de réaction.", "match": "Utile dans les échanges rapides à hauteur intermédiaire.", "responses": "Peut provoquer une crise de temps et une réponse imprécise.", "how": ["Je garde la raquette devant.", "Coude légèrement fléchi.", "Contact devant l’épaule.", "Geste court vers l’avant.", "Pas de grand mouvement arrière.", "Trajectoire rapide et presque horizontale.", "Je remonte la raquette."], "exercise": "Échange de drives", "org": "Les deux joueurs entre ligne de service court et ligne de fond; 20 drives consécutifs.", "success": "15 consécutifs dans les limites."}, {"id": "smash", "icon": "💥", "title": "Smash", "purpose": "Frapper avec une trajectoire descendante.", "match": "À utiliser sur un volant haut et favorable.", "responses": "Peut produire une défense courte, haute ou imprécise.", "how": ["Je recule pour avoir le volant devant.", "J’arme loin derrière.", "Je contacte haut et devant.", "J’accélère vers l’avant et le bas.", "Je me replace face au filet."], "exercise": "10 smashs vers une cible", "org": "10 volants hauts vers l’arrière; cible 2 m × 2 m dans la moitié avant.", "success": "7/10 descendants dans la cible."}, {"id": "dropback", "icon": "🪶", "title": "Amorti de fond de terrain", "purpose": "Depuis le fond, faire tomber le volant près du filet.", "match": "Fait avancer l’adversaire.", "responses": "Peut provoquer une réponse courte, haute ou difficile.", "how": ["Je me place derrière comme pour un dégagé.", "Je prépare tôt.", "Contact haut et devant.", "Préparation proche du dégagé.", "Je réduis la vitesse au contact.", "Je passe juste au-dessus du filet.", "Je vise entre le filet et la moitié de la rivière."], "exercise": "10 amortis de fond", "org": "10 volants hauts vers le fond; cible entre le filet et la moitié de la rivière.", "success": "7/10 dans la cible."}, {"id": "dropmid", "icon": "🎯", "title": "Amorti du milieu du terrain", "purpose": "Depuis le milieu, jouer court avec un geste réduit.", "match": "Permet de jouer derrière le filet quand on est déjà avancé.", "responses": "L’adversaire doit avancer vite et peut renvoyer haut ou court.", "how": ["Je prends le volant devant.", "Raquette devant le corps.", "Préparation courte.", "Contact devant l’épaule.", "Je dose la force.", "Je passe juste au-dessus du filet.", "Je cherche une chute rapide."], "exercise": "10 amortis du milieu", "org": "A à 1 m derrière la ligne de service court; B envoie 10 volants à hauteur de poitrine; cible = entre le filet et 1 m derrière la ligne de service court adverse.", "success": "7/10 dans la cible."}]};let app=document.getElementById('app'),cur=null,lev=0;
function home(){app.innerHTML='<section class="hero"><h2>Que veux-tu travailler aujourd’hui ?</h2><p>Chaque atelier précise l’organisation, les consignes, comment réussir et comment simplifier ou complexifier.</p></section><div class="grid">'+D.projects.map(p=>`<article class="card" onclick="project('${p[0]}')"><div class="icon">${p[1]}</div><h2>${p[2]}</h2><p>${p[3]}</p></article>`).join('')+`<article class="card" onclick="techHome()"><div class="icon">🏸</div><h2>Apprendre un coup technique</h2><p>Comprendre le geste, l’intention en match et s’entraîner.</p></article><article class="card" onclick="diag()"><div class="icon">🧭</div><h2>Je ne sais pas quoi choisir</h2><p>3 questions pour trouver une piste.</p></article></div>`}
function project(k){cur=k;lev=0;render()}
function render(){let p=D.projects.find(x=>x[0]==cur),e=D.exercises[cur][lev];app.innerHTML=`<button class="back" onclick="home()">← Retour</button><section class="hero"><span class="tag">${p[1]} ${p[2]}</span><h2>${e.title}</h2><p>${e.objective}</p></section><div class="levels">${['Découvrir','Stabiliser','Réinvestir'].map((x,i)=>`<button class="level ${i==lev?'active':''}" onclick="lev=${i};render()">${x}</button>`).join('')}</div><section class="panel"><h3>📍 Organisation</h3><p>${e.org}</p><h3>▶️ Consignes</h3><p>${e.instructions}</p><h3>💡 Conseils pour réussir</h3><ul>${e.tips.map(x=>`<li>${x}</li>`).join('')}</ul><div class="success"><h3>✅ Critère de réussite</h3><p>${e.success}</p></div><div class="var easy"><h3>🟢 Pour simplifier</h3><ul>${e.easy.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="var hard"><h3>🔴 Pour complexifier</h3><ul>${e.hard.map(x=>`<li>${x}</li>`).join('')}</ul></div></section>`}
function techHome(){app.innerHTML=`<button class="back" onclick="home()">← Retour</button><section class="hero"><h2>🏸 Apprendre un coup technique</h2><p>Choisis un coup pour comprendre son rôle, ses réponses possibles et apprendre le geste.</p></section><div class="tech">${D.techniques.map(t=>`<article class="card" onclick="tech('${t.id}')"><div class="icon">${t.icon}</div><h2>${t.title}</h2><p>${t.purpose}</p></article>`).join('')}</div>`}
function tech(id){let t=D.techniques.find(x=>x.id==id);app.innerHTML=`<button class="back" onclick="techHome()">← Coups techniques</button><section class="hero"><span class="tag">${t.icon} ${t.title}</span><h2>${t.purpose}</h2></section><section class="panel"><h3>🏸 En match</h3><p>${t.match}</p><h3>🔁 Réponses possibles</h3><p>${t.responses}</p><h3>🛠️ Comment réaliser le geste ?</h3><ul>${t.how.map(x=>`<li>${x}</li>`).join('')}</ul><h3>🎯 Exercice : ${t.exercise}</h3><p>${t.org}</p><div class="success"><h3>✅ Critère de réussite</h3><p>${t.success}</p></div></section>`}
function diag(){let qs=[['Quelle difficulté te ressemble le plus ?',['service|Je donne trop de points sur mes services','attack|J’ai du mal à attaquer','opportunity|Je crée peu d’occasions d’attaque','move|Je déplace peu mon adversaire','net|Je suis en difficulté au filet','point|Je ne sais pas construire le point']],['Que veux-tu améliorer ?',['attack|Attaquer','move|Faire bouger','net|Jouer au filet','service|Servir','point|Choisir mes coups']],['Geste précis ?',['tech|Oui, un coup technique','point|Non, une situation de match']]];let s=0,a=[];function q(){let x=qs[s];app.innerHTML=`<button class="back" onclick="home()">← Retour</button><section class="hero"><h2>🧭 Diagnostic</h2><p>${x[0]}</p></section><div class="choice">${x[1].map(z=>{let [v,l]=z.split('|');return `<button onclick="a.push('${v}');s++;${s<qs.length?'q()':'res()'}">${l}</button>`}).join('')}</div>`}function res(){let c={};a.forEach(x=>c[x]=(c[x]||0)+1);let k=Object.keys(c).sort((x,y)=>c[y]-c[x])[0];if(k=='tech')techHome();else project(D.projects.some(p=>p[0]==k)?k:'point')}q()}home();</script></main></body></html>
