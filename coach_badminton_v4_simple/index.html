<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach Badminton V4 — Exercices</title><style>

</style><style>.diagram-img{display:block;width:100%;max-width:640px;height:auto;margin:14px auto;border-radius:12px;border:1px solid #dbe2ec}.levels{display:flex;flex-wrap:wrap;gap:8px}.levels button{flex:1 1 150px}.panel{overflow-wrap:anywhere}.section p{line-height:1.55}.choice button{min-height:48px}@media(max-width:650px){.grid{grid-template-columns:1fr}header{position:static}.panel,.hero{padding:14px}}</style></head><body><header><h1>🏸 Coach Badminton V4</h1><p>EPS • Terminale • Un scan, et au travail !</p></header><main id="app"></main><script>const P=[

const E={
service:[
["Découvrir","Service court","Pour surprendre l’adversaire et obtenir une réponse favorable, ou au moins l’empêcher d’attaquer.","Un serveur et un receveur. Le receveur reste dans sa zone et ne bouge pas pendant le service. Cible : entre la ligne de service court et une ligne imaginaire située 1 m plus loin vers le fond. Une corde peut matérialiser cette ligne.","Réaliser 10 services courts vers la cible. Le receveur laisse tomber le volant ou le remet au serveur.","Je garde des appuis stables. Le volant est devant moi et je ne le lance pas. Je fais un petit geste contrôlé et bas. La trajectoire passe juste au-dessus du filet. Je regarde la cible et termine le geste vers elle.","7/10 dans la zone cible.","La trajectoire reste basse et tombe près de la ligne de service court, sans offrir une attaque facile.","Agrandir la cible et/ou faire annoncer la zone au serveur.","Réduire la cible et réaliser un service court de coup droit."],
["Stabiliser","Service stratégique","Obtenir une réponse exploitable en servant dans l’espace disponible.","Un serveur et un adversaire placé librement dans sa zone de réception. Il ne bouge pas pendant le service mais peut changer sa position après chaque échange.","Réaliser 10 services en observant la position du receveur. Chercher à l’empêcher de toucher le volant dans une zone confortable.","Je regarde toujours la position adverse. Adversaire loin du filet : service court ; avancé : service très long ; trop centré : viser un côté. Je prépare mon intention avant de servir. La tête de raquette finit vers la zone visée.","7/10 services donnent directement le point.","Même lorsqu’il touche le volant, le service l’envoie dans un espace libre et crée une réponse favorable.","Le receveur garde un pied sur la ligne blanche.","Le receveur peut déplacer un pied avant le service."],
["Réinvestir","Service + intention tactique","Tirer profit de chaque service.","Match 1 contre 1 jusqu’à 11 points. Le joueur en travail sert à chaque point.","Après le service, deux touches supplémentaires maximum sont autorisées pour gagner le point. Au-delà, le point est perdu automatiquement.","J’observe la position adverse avant de servir. Je choisis mentalement une intention. J’anticipe la réponse et j’exploite immédiatement un retour facile. Je me replace après chaque frappe.","Au moins 5 services conduisent à un point gagné immédiatement.","Je choisis réellement le service en fonction de l’adversaire et j’exploite la réponse favorable.","L’adversaire commence l’échange avec un pied sur la ligne blanche.","Une seule touche supplémentaire est autorisée après le service."]
],
attack:[
["Découvrir","Découvrir le smash","Créer une frappe descendante puissante sur un volant haut et favorable.","Par 2. Le lanceur envoie 10 volants hauts vers l’arrière. Le frappeur démarre au milieu puis recule derrière le volant.","Réaliser 10 smashs en prenant le volant haut et devant soi, puis se replacer.","Je recule plus loin que le volant. Le volant doit être devant moi au moment de l’impact, pas au-dessus de ma tête. J’arme mon bras loin derrière. Mes appuis sont fixes et ma jambe forte est derrière. Je frappe fort, avec un geste descendant, qui commence loin derrière et finit face au filet. Je termine face au filet et je me replace.","7/10 trajectoires descendantes atteignent la moitié avant.","Le geste est fluide, le contact est devant la tête et la trajectoire descend nettement.","Utiliser des volants plus hauts et plus lents.","Varier légèrement la profondeur des lancers."],
["Stabiliser","Smash avec cible annoncée","Conserver une attaque descendante tout en dirigeant précisément le volant.","Par 2. Le lanceur annonce à voix haute gauche, milieu ou droite avant chaque lancer. Trois cibles sont matérialisées dans la moitié adverse.","Le lanceur annonce la cible. Le frappeur recule, prend le volant haut et devant, puis tente la cible annoncée.","Je recule suffisamment. Je prépare tôt. Je garde le volant devant moi. Je dirige la fin du geste vers la cible sans perdre la trajectoire descendante. Je me replace immédiatement.","8/12 smashs atteignent la cible annoncée avec une trajectoire descendante.","La préparation et le contact restent stables malgré le changement de direction.","Le frappeur annonce lui-même sa cible.","Placer la cible à moins de 20 cm des lignes latérales."],
["Réinvestir","Smash bonus en match","Transformer un volant favorable en attaque décisive.","Match 1 contre 1 jusqu’à 11 points.","Si le joueur en travail réalise un smash et que le volant tombe directement au sol, il marque 2 points au lieu de 1.","Je n’attaque que sur un volant favorable. Je recule assez pour frapper devant moi. Je choisis une zone libre et je me prépare au retour si le smash est défendu.","Réaliser au moins 5 points bonus sur le match.","Tenter le smash lorsque la situation est réellement favorable et viser un espace exploitable.","Le partenaire envoie régulièrement un volant favorable.","Le défenseur peut varier librement la profondeur de ses retours."]
],
opportunity:[
["Découvrir","Valoriser le dégagé offensif","Mettre l’adversaire en difficulté en le faisant reculer.","Deux partenaires échangent des volants hauts et lents en restant proches l’un de l’autre.","Lorsque le joueur le décide, il rompt l’échange en accélérant avec un dégagé offensif. Les deux joueurs terminent alors l’échange en opposition.","Je prends le volant devant moi. J’utilise une grande amplitude et termine la tête de raquette vers l’avant. Mes épaules reviennent face au filet. Je cherche une trajectoire longue et rapide.","7/10 dégagés ne reviennent pas dans une situation favorable.","L’adversaire est réellement contraint de reculer et perd du temps pour se replacer.","Annoncer le dégagé avant de le jouer.","Faire commencer les deux joueurs plus au milieu du terrain."],
["Stabiliser","Amorti de fond de court","Faire croire à un dégagé puis ralentir brutalement le volant pour le faire tomber court.","Départ au fond de court. Le partenaire envoie haut. Le joueur en travail rompt le partenariat par un amorti de fond de court puis poursuit en opposition.","Préparer le geste comme un dégagé offensif, puis ralentir nettement au moment de l’impact pour faire tomber le volant derrière la ligne de service court.","Je garde une préparation proche du dégagé offensif. L’amplitude reste grande pour masquer l’intention. Je prends le volant devant moi. Je freine brutalement le geste à l’impact. La trajectoire devient lente et courte.","7/10 amortis tombent dans la zone courte visée.","La préparation ressemble à celle d’un dégagé et le ralentissement à l’impact est net.","Annoncer l’amorti avant de le jouer.","Faire partir le joueur et le partenaire plus au milieu du terrain."],
["Réinvestir","Dégagé ou amorti pour créer l’attaque","Créer une situation favorable à partir d’un choix entre deux frappes.","Opposition 1 contre 1 sur tout le terrain.","À chaque situation favorable, choisir dégagé offensif ou amorti de fond de court, puis poursuivre l’échange.","J’observe la position adverse. Je choisis le coup qui crée le plus de déplacement ou de retard. Je me replace avant la réponse.","5 occasions d’attaque créées sur 8 séquences.","Le choix du coup dépend de la position adverse et produit une difficulté identifiable.","Le partenaire renvoie haut après chaque coup.","Le partenaire choisit librement ses réponses."]
],
move:[
["Découvrir","Long / court","Faire déplacer l’adversaire entre l’avant et l’arrière du terrain.","Par 2, en partenariat. Le distributeur envoie un volant long puis un volant court. Le joueur en travail commence au centre.","Renvoyer les volants au centre après chaque frappe. Chercher à faire entrer le partenaire dans la zone avant pour le court et dans la zone arrière pour le long.","Je regarde la position du partenaire. Je prépare tôt et je reviens au centre après chaque frappe. Je cherche une vraie différence de profondeur.","Le partenaire entre dans la zone avant pour jouer le court ou dans la zone arrière pour jouer le long dans 7/10 situations.","Le changement de profondeur provoque un déplacement net et perturbe le replacement.","Annoncer long ou court avant l’envoi.","Alterner long et court sans annoncer."],
["Stabiliser","Les 4 zones","Déplacer l’adversaire en utilisant successivement quatre espaces du terrain.","Par 2. Quatre zones sont matérialisées dans le terrain adverse : avant droite, avant gauche, arrière droite, arrière gauche.","Envoyer le volant dans chacune des quatre zones avant de rompre le partenariat et de conclure le point.","Je regarde où se trouve l’adversaire avant de choisir. Je cherche une zone réellement éloignée de sa position. Je me replace après chaque frappe.","Atteindre les 4 zones dans 8 séries sur 10.","Les choix de zones provoquent des déplacements visibles et ouvrent ensuite un espace libre.","Agrandir les quatre zones.","Réduire les quatre zones et imposer un ordre libre sans répétition immédiate."],
["Réinvestir","4 zones en match","Déplacer l’adversaire puis exploiter l’espace libéré.","Match 1 contre 1 jusqu’à 11 points avec quatre zones matérialisées.","Le joueur en travail ne peut pas jouer deux fois de suite dans la même zone, sinon il perd immédiatement le point.","Je change de zone pour déplacer l’adversaire. Je regarde sa nouvelle position avant la frappe suivante. Je joue ensuite dans l’espace libéré.","Respecter la règle dans au moins 8/10 échanges observés.","Je change de zone pour déplacer l’adversaire puis j’exploite l’espace devenu libre.","Autoriser deux fois la même zone, mais changer à la troisième.","Interdire toute répétition d’une zone avant d’avoir utilisé les quatre."]
],
net:[
["Découvrir","Apprendre le kill","Prendre très tôt un volant favorable près du filet pour le conclure avec une trajectoire descendante.","Par 2. Le partenaire envoie un volant haut et proche du filet. Le joueur en travail démarre derrière la ligne de service court.","Avancer, prendre le volant très tôt devant soi et jouer une frappe descendante qui tombe rapidement.","Je garde la raquette haute. J’avance vite. Je prends le volant devant moi et le plus tôt possible. Le geste est court et dirigé vers le bas. Je termine équilibré et je me replace.","7/10 volants passent avec une trajectoire descendante et tombent dans la première moitié du terrain adverse.","Le contact est très précoce, devant soi, et le volant tombe rapidement.","Utiliser des volants plus hauts et plus lents.","Apprendre le kill en revers."],
["Stabiliser","Contre-amorti","Répondre à un amorti par un jeu court et précis près du filet.","Le joueur en travail démarre juste derrière sa ligne de service court. Le partenaire joue des amortis vers l’avant.","Avancer, prendre le volant tôt et jouer un contre-amorti court dans la zone située entre le filet et la moitié avant.","Je garde la raquette haute. Je fais une fente contrôlée. Le contact est devant et au-dessus du filet. Le geste est très court et la force dosée.","7/10 contre-amortis dans la zone.","Le volant reste bas et tombe court sans être offert à l’adversaire.","Recevoir des volants plus hauts.","Alterner droite et gauche."],
["Réinvestir","Kill / contre-amorti en match","Conclure ou reprendre l’avantage au filet en fonction de la hauteur et de la position du volant.","Match 1 contre 1. L’adversaire doit jouer tous ses retours dans les deux premiers tiers du terrain.","Lorsqu’un point est gagné sur un kill ou un contre-amorti, il compte double.","Je prends tôt les volants favorables. Je choisis kill si le volant est suffisamment haut et contre-amorti si je dois garder le volant bas. Je me replace après la frappe.","Gagner au moins 3 points doubles.","Le choix du coup correspond à la hauteur et à la position du volant.","L’adversaire est limité aux deux premiers tiers.","L’adversaire peut utiliser tout le terrain."]
],
point:[
["Découvrir","Construire en observant","Repérer rapidement la difficulté adverse et choisir la frappe qui l’exploite.","Le joueur en travail réalise 10 services. Après chaque frappe, l’adversaire doit toucher avec sa raquette un plot au sol : 1 au centre près du filet, 2 au milieu à droite, 3 au milieu à gauche, 4 au centre sur la ligne de fond.","Jouer le point en opposition et observer quel plot l’adversaire touche après chaque frappe. Chercher à gagner rapidement lorsque sa position devient défavorable.","Je regarde le déplacement adverse avant de choisir. Je joue dans l’espace libéré ou vers la zone qui lui pose difficulté. Je me replace après chaque frappe.","Gagner au moins 7/10 points.","Le joueur identifie la zone de replacement adverse et choisit une réponse qui le met rapidement en difficulté.","Rapprocher les plots du centre.","Éloigner les plots des zones centrales."],
["Stabiliser","Construire en visant","Gagner en exploitant les espaces stratégiques sans viser une zone centrale protégée.","Match 1 contre 1. Une zone centrale d’environ 2 m × 1 m dans le terrain adverse est interdite comme cible.","Jouer le point sans viser la zone interdite. Chercher les espaces utiles pour déplacer puis conclure.","Je regarde la position adverse. Je choisis les espaces latéraux ou avant/arrière disponibles. Je garde une intention claire jusqu’à la frappe.","Dans 8/10 séquences observées, la zone interdite est évitée et le point est construit avec une intention identifiable.","Le handicap est peu gênant car les espaces stratégiques sont réellement utilisés.","Réduire la zone interdite.","Agrandir la zone interdite."],
["Réinvestir","Le bingo","Identifier le moment où la conclusion du point devient réellement favorable.","Opposition, match 1 contre 1 jusqu’à 11 points, sans zones ni handicap.","Juste avant une conclusion réellement favorable, annoncer « bingo ». Si le point est gagné, il vaut 3 points au lieu de 1.","Je n’annonce bingo que lorsque l’adversaire est réellement en difficulté. J’anticipe la frappe suivante et je conclus dans l’espace disponible.","Réaliser au moins 3 bingo réussis dans le match.","L’annonce correspond à une vraie situation de conclusion favorable.","Autoriser bingo lorsque l’adversaire est clairement en difficulté.","Devoir annoncer bingo avant que l’adversaire ne frappe le volant." ]
],
favorable:[
["Découvrir","Le retard","Profiter rapidement d’un adversaire en difficulté pour conclure le point.","Opposition 1 contre 1. L’adversaire commence chaque échange avec sa raquette posée sur le filet.","Jouer le point et chercher à conclure en deux touches supplémentaires maximum.","Je regarde immédiatement la position et le retard adverse. Je joue dans l’espace libre plutôt que de chercher la puissance. Je me replace si la conclusion n’est pas possible.","Conclure en deux touches supplémentaires ou moins dans 7/10 situations.","La réponse exploite clairement le retard adverse et la frappe suivante est préparée.","Adversaire assis au départ.","Adversaire dos au filet ou placé au fond du terrain au départ."],
["Stabiliser","La main non dominante","Exploiter une difficulté technique visible chez l’adversaire.","Opposition 1 contre 1 sur tout le terrain. L’adversaire joue tous ses coups avec sa main non dominante.","Jouer le point normalement et chercher à accentuer les difficultés repérées.","J’observe la qualité des frappes adverses. Je repère les trajectoires courtes ou imprécises. Je joue ensuite dans l’espace ou sur la zone qui accentue la difficulté, sans chercher à frapper fort à tout prix.","Gagner au moins 7/10 échanges.","Le joueur identifie une difficulté puis adapte son choix pour l’exploiter.","L’adversaire sert avec sa main dominante.","L’adversaire peut changer de main après chaque échange."],
["Réinvestir","Le résistant","Gérer plusieurs adversaires successifs en conservant une stratégie d’exploitation des difficultés.","Le joueur en travail dispose de 5 vies et affronte successivement les adversaires du groupe. Un point est joué contre chaque adversaire. Une victoire permet de rester, une défaite fait perdre une vie.","Jouer successivement contre les adversaires. Noter le temps total de résistance et le nombre de points gagnés.","J’observe rapidement chaque nouvel adversaire et adapte mon choix de frappe. Je cherche à exploiter sa difficulté sans prendre de risque inutile.","Mesurer le temps de résistance et le nombre de points gagnés, puis comparer les deux indicateurs entre séances.","La stratégie s’adapte réellement d’un adversaire à l’autre.","Commencer contre un adversaire dont les difficultés sont annoncées.","Commencer contre un adversaire dont les difficultés ne sont pas annoncées."]
],
technical:[
["Découvrir","Dégagé offensif","Repousser l’adversaire vers le fond avec une trajectoire longue et rapide.","Par 2. Le lanceur envoie haut vers le fond. Le joueur frappe depuis l’arrière du terrain.","Réaliser 10 dégagés offensifs vers la zone arrière adverse.","Je prends le volant haut et devant. J’accélère le geste et termine vers l’avant. Je me replace après la frappe.","7/10 atteignent le dernier tiers.","Trajectoire longue, tendue et suffisamment rapide.","Agrandir la cible.","Réduire la cible au dernier mètre du terrain."],
["Stabiliser","Dégagé défensif","Gagner du temps en envoyant le volant haut et profond.","Par 2. Le partenaire met le joueur en difficulté avec des volants hauts ou offensifs.","Réaliser 10 dégagés défensifs hauts et profonds.","Je privilégie la hauteur et la profondeur. Je prends le volant devant moi et je me replace.","7/10 dépassent la moitié arrière.","Trajectoire haute donnant du temps pour se replacer.","Lancer plus régulièrement.","Ajouter une variation de profondeur."],
["Réinvestir","Drive","Accélérer le jeu à hauteur intermédiaire avec une trajectoire tendue.","Par 2. Échange de drives sur une zone centrale.","Réaliser 12 drives en gardant une trajectoire tendue et contrôlée.","Raquette devant, préparation courte, contact devant et geste compact. Je garde les appuis actifs.","8/12 drives restent dans la zone d’échange.","Trajectoire tendue et contrôle de la direction.","Agrandir la zone.","Réduire la zone latérale."],
["Découvrir","Smash technique","Produire une frappe descendante sur un volant haut.","Par 2. Le partenaire lance haut vers l’arrière.","Réaliser 10 smashs et se replacer après chaque frappe.","Je recule derrière le volant, je frappe haut et devant, puis je termine face au filet.","7/10 trajectoires descendantes.","Contact devant et geste descendant.","Volants plus hauts.","Varier la profondeur."],

};

const state={project:null,level:0,quiz:{i:0,scores:{}}};
const imageMap={'service-0': true, 'service-1': true, 'attack-0': true, 'attack-1': true, 'opportunity-0': true, 'opportunity-1': true, 'move-0': true, 'move-1': true, 'move-2': true, 'net-0': true, 'point-0': true, 'point-1': true};
function home(){state.project=null;app.innerHTML=`<div class="hero"><h2>🏸 Bienvenue</h2><p>Choisis un projet et commence directement, sans compte ni code.</p><button onclick="diagnostic()">🧭 M’aider à choisir un exercice</button></div><div class="grid">${P.map(p=>`<div class="card" role="button" tabindex="0" onclick="project('${p[0]}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();project('${p[0]}')}"><span class="tag">${p[1]}</span><h3>${p[2]}</h3><p>${p[3]}</p></div>`).join('')}</div>`}
function project(id){state.project=id;state.level=0;renderProject()}
function renderProject(){const p=P.find(x=>x[0]===state.project),arr=E[state.project];app.innerHTML=`<div class="panel"><button class="secondary" onclick="home()">← Tous les projets</button><span class="tag">${p[1]}</span><h2>${p[2]}</h2><p class="muted">${p[3]}</p><div class="levels">${arr.map((x,i)=>`<button class="level ${i===state.level?'active':''}" onclick="state.level=${i};renderProject()">${state.project==='technical'?x[1]:x[0]+' · '+x[1]}</button>`).join('')}</div></div>${exerciseCard(arr[state.level])}`;window.scrollTo(0,0)}
function exerciseCard(x){const [level,title,obj,org,cons,tips,quant,qual,easy,hard]=x;const key=state.project+'-'+state.level;const picture=imageMap[key]?`<img class="diagram-img" src="images/${key}.png" alt="Schéma pédagogique de l’exercice ${title}" loading="lazy">`:'';return `<div class="panel"><h2>${title}</h2><div class="section"><b>🎯 Objectif</b><p>${obj}</p></div><div class="section"><b>📍 Disposition</b><p>${org}</p></div>${picture}<div class="section"><b>▶️ Consignes</b><p>${cons}</p></div><div class="section"><b>💡 Conseils pour réussir</b><p>${tips}</p></div><div class="section success"><b>✅ Critères de réussite</b><p>1. ${quant}</p><p>2. ${qual}</p></div><div class="section easy"><b>🔄 🟢 Pour simplifier</b><p>${easy}</p></div><div class="section hard"><b>🔄 🔴 Pour complexifier</b><p>${hard}</p></div></div>`}
const Q=[
["Que veux-tu surtout améliorer ?",["Le service","Attaquer","Déplacer l’adversaire","Gagner le point"],["service","attack","move","point"]],
["Quelle situation te pose le plus problème ?",["Je donne des services faciles","Je n’ose pas attaquer","Mon adversaire reste bien placé","Je ne sais pas quand conclure"],["service","attack","move","point"]],
["Quel coup veux-tu travailler ?",["Service court","Smash","Amorti / dégagé","Jeu au filet"],["service","attack","opportunity","net"]],
["Que se passe-t-il souvent en match ?",["Je perds le point sur mon service","J’attaque dans de mauvaises situations","Je ne fais pas assez bouger l’adversaire","Je rate la conclusion"],["service","attack","move","point"]],
["Tu préfères travailler...",["Un geste précis","Un choix tactique","Une situation de match","Je ne sais pas"],["technical","favorable","point","opportunity"]]
];
